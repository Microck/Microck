name: Update npm downloads

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npm-downloads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Recalculate all-time downloads
        run: node scripts/update-npm-downloads.mjs
      - name: Commit updated badge and counts
        run: |
          git config user.name 'Microck'
          git config user.email 'contact@micr.dev'
          git add assets/npm-downloads.svg assets/npm-downloads.json
          if ! git diff --cached --quiet; then
            git commit -m 'update npm download badge'
            git push
          fi
